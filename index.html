<!DOCTYPE html>
<!-- Style kit settings: dark until the user picks a theme; saved keys get a "tipTracker." prefix -->
<html lang="en" data-default-theme="dark" data-storage-prefix="tipTracker">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💲</text></svg>"
    />
    <script type="module" src="./main.js"></script>
  </head>
  <!-- No inline background needed: the build links the stylesheet in <head>, and
   themeBootPlugin (vite.config.js) applies the saved theme before first paint. -->
  <body>
    <div id="app">
      <!-- Vue app will be mounted here -->
    </div>
  </body>
</html>
